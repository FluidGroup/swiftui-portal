<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title description">
  <title id="title">SwiftUI Portal</title>
  <desc id="description">One source. Live mirrors. A blue counter card and its vertically flipped reflection, softly blurring into the background.</desc>
  <defs>
    <linearGradient id="background" x2="0.85" y2="1">
      <stop stop-color="#FAFBFD"/>
      <stop offset="1" stop-color="#EDF2F8"/>
    </linearGradient>
    <radialGradient id="light">
      <stop stop-color="#CDEDF0" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#CDEDF0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x2="1" y2="0.6">
      <stop stop-color="#5065FF"/>
      <stop offset="0.52" stop-color="#168CF1"/>
      <stop offset="1" stop-color="#00BFC4"/>
    </linearGradient>
    <linearGradient id="cardShine" x2="0" y2="1">
      <stop stop-color="white" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plane">
      <stop stop-color="#8BBDCE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8BBDCE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8BBDCE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="454" x2="0" y2="734">
      <stop stop-color="white" stop-opacity="0.58"/>
      <stop offset="0.3" stop-color="white" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="white" stop-opacity="0.12"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sharpBand" gradientUnits="userSpaceOnUse" x1="0" y1="454" x2="0" y2="524">
      <stop offset="0.5" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
    <linearGradient id="softBand" gradientUnits="userSpaceOnUse" x1="0" y1="489" x2="0" y2="584">
      <stop stop-color="black"/>
      <stop offset="0.3684" stop-color="white"/>
      <stop offset="0.6842" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
    <linearGradient id="blurredBand" gradientUnits="userSpaceOnUse" x1="0" y1="554" x2="0" y2="654">
      <stop stop-color="black"/>
      <stop offset="0.3" stop-color="white"/>
      <stop offset="0.6" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
    <linearGradient id="diffuseBand" gradientUnits="userSpaceOnUse" x1="0" y1="614" x2="0" y2="654">
      <stop stop-color="black"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="reflectionFade" maskUnits="userSpaceOnUse" x="740" y="440" width="800" height="340">
      <rect x="740" y="440" width="800" height="340" fill="url(#fade)"/>
    </mask>
    <mask id="sharp" maskUnits="userSpaceOnUse" x="740" y="440" width="800" height="340">
      <rect x="740" y="440" width="800" height="340" fill="url(#sharpBand)"/>
    </mask>
    <mask id="soft" maskUnits="userSpaceOnUse" x="740" y="440" width="800" height="340">
      <rect x="740" y="440" width="800" height="340" fill="url(#softBand)"/>
    </mask>
    <mask id="blurred" maskUnits="userSpaceOnUse" x="740" y="440" width="800" height="340">
      <rect x="740" y="440" width="800" height="340" fill="url(#blurredBand)"/>
    </mask>
    <mask id="diffuse" maskUnits="userSpaceOnUse" x="740" y="440" width="800" height="340">
      <rect x="740" y="440" width="800" height="340" fill="url(#diffuseBand)"/>
    </mask>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="220%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#385693" flood-opacity="0.12"/>
    </filter>
    <filter id="blur4" x="-30%" y="-50%" width="160%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur10" x="-30%" y="-50%" width="160%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="blur18" x="-30%" y="-50%" width="160%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <g id="liveCard">
      <rect width="536" height="264" rx="38" fill="url(#card)"/>
      <rect x="1" y="1" width="534" height="262" rx="37" fill="none" stroke="url(#cardShine)" stroke-width="2"/>
      <g fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif">
        <text x="38" y="58" font-size="21" font-weight="600" letter-spacing="2">LIVE VIEW</text>
        <text x="33" y="180" font-size="112" font-weight="650" letter-spacing="-6">07</text>
      </g>
      <circle cx="478" cy="52" r="20" fill="white" fill-opacity="0.95"/>
      <path d="M470 52h16m-8-8v16" fill="none" stroke="#04A5D0" stroke-width="3.5" stroke-linecap="round"/>
      <g fill="white">
        <rect x="40" y="213" width="9" height="24" rx="4.5"/>
        <rect x="60" y="213" width="9" height="24" rx="4.5" opacity="0.4"/>
        <rect x="80" y="213" width="9" height="24" rx="4.5"/>
        <rect x="100" y="213" width="9" height="24" rx="4.5" opacity="0.4"/>
        <rect x="120" y="213" width="9" height="24" rx="4.5"/>
        <rect x="140" y="213" width="9" height="24" rx="4.5" opacity="0.4"/>
        <rect x="160" y="213" width="9" height="24" rx="4.5"/>
        <rect x="180" y="213" width="9" height="24" rx="4.5" opacity="0.4"/>
        <rect x="200" y="213" width="9" height="24" rx="4.5"/>
        <rect x="220" y="213" width="9" height="24" rx="4.5" opacity="0.4"/>
        <rect x="240" y="213" width="9" height="24" rx="4.5"/>
        <rect x="260" y="213" width="9" height="24" rx="4.5" opacity="0.4"/>
        <rect x="280" y="213" width="9" height="24" rx="4.5"/>
        <rect x="300" y="213" width="9" height="24" rx="4.5" opacity="0.4"/>
        <rect x="320" y="213" width="9" height="24" rx="4.5"/>
        <rect x="340" y="213" width="9" height="24" rx="4.5" opacity="0.4"/>
        <rect x="360" y="213" width="9" height="24" rx="4.5"/>
        <rect x="380" y="213" width="9" height="24" rx="4.5" opacity="0.4"/>
        <rect x="400" y="213" width="9" height="24" rx="4.5"/>
        <rect x="420" y="213" width="9" height="24" rx="4.5" opacity="0.4"/>
        <rect x="440" y="213" width="9" height="24" rx="4.5"/>
        <rect x="460" y="213" width="9" height="24" rx="4.5" opacity="0.4"/>
        <rect x="480" y="213" width="9" height="24" rx="4.5"/>
      </g>
    </g>
    <g id="reflectedCard" transform="translate(880 718) scale(1 -1)">
      <use xlink:href="#liveCard"/>
    </g>
  </defs>
  <rect width="1600" height="800" fill="url(#background)"/>
  <ellipse cx="1170" cy="465" rx="580" ry="370" fill="url(#light)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif">
    <g transform="translate(104 99)" fill="none" stroke="#243955" stroke-width="2.5">
      <rect x="0" y="-16" width="20" height="20" rx="5"/>
      <rect x="9" y="-7" width="20" height="20" rx="5" fill="#F9FAFD"/>
    </g>
    <text x="150" y="103" fill="#344961" font-size="16" font-weight="650" letter-spacing="3.5">FLUIDGROUP</text>
    <text x="105" y="246" fill="#53708D" font-size="23" font-weight="500" letter-spacing="3">SWIFTUI</text>
    <text x="93" y="387" fill="#122A46" font-size="162" font-weight="650" letter-spacing="-8">Portal</text>
    <text x="105" y="448" fill="#57708A" font-size="29" font-weight="400" letter-spacing="-0.6">One source. Live mirrors.</text>
    <text x="884" y="148" fill="#648099" font-size="14" font-weight="600" letter-spacing="2.7">SOURCE</text>
    <text x="105" y="691" fill="#8292A5" font-size="17" font-weight="450">SwiftUI + UIKit</text>
  </g>
  <text x="105" y="510" fill="#315578" font-family="'SF Mono', Menlo, monospace" font-size="19" letter-spacing="-0.4">MirrorView  /  @PortalSource</text>
  <ellipse cx="1148" cy="449" rx="318" ry="16" fill="none" stroke="url(#plane)" stroke-width="1.5"/>
  <path d="M777 448H1520" stroke="url(#plane)" stroke-width="1"/>
  <g mask="url(#reflectionFade)">
    <use xlink:href="#reflectedCard" mask="url(#sharp)"/>
    <g mask="url(#soft)"><use xlink:href="#reflectedCard" filter="url(#blur4)"/></g>
    <g mask="url(#blurred)"><use xlink:href="#reflectedCard" filter="url(#blur10)"/></g>
    <g mask="url(#diffuse)"><use xlink:href="#reflectedCard" filter="url(#blur18)"/></g>
  </g>
  <g transform="translate(880 178)" filter="url(#shadow)">
    <use xlink:href="#liveCard"/>
  </g>
</svg>
